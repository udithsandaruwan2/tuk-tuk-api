name: Node API CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build Docker image
        run: docker build -t tuk-tuk-api:ci .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/tuk-tuk-api
            git pull origin main
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            export JWT_EXPIRES_IN='8h'
            export MONGODB_URI='mongodb://mongo:27017/tuk_tuk'
            export NODE_ENV='production'
            docker compose down
            docker compose up -d --build
            docker compose exec -T api npm run db:seed:if-empty
            curl -fsS http://localhost:3000/health
