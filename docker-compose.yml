# Variable substitution in `labels` / `command` uses the project `.env` file (or your shell),
# not `env_file` on services. Quick start: `cp compose.env.example .env` then edit emails/secrets.
#
# Traefik checklist (production HTTPS — matches Cloudflare + origin TLS):
# 1) Entrypoints: web=:80, websecure=:443
# 2) Force HTTP → HTTPS: web → websecure (scheme https)
# 3) Let's Encrypt HTTP-01 on `web`; certs in /letsencrypt (volume letsencrypt_data)
# 4) App router: Host(APP_DOMAIN), entrypoints=websecure, tls=true, certresolver=letsencrypt
# 5) Ports published: 80, 443, 8080 (dashboard)
#
# HTTPS behaviour (profile `traefik`):
# - Entrypoint `web` (:80) globally redirects HTTP → HTTPS on `websecure` (:443).
# - Let's Encrypt HTTP-01 uses `web` first; Traefik serves `/.well-known/acme-challenge/*` before redirect.
# - Certificates persist in Docker volume `letsencrypt_data` (or bind-mount ./letsencrypt:/letsencrypt if you prefer).
#
# Local API only (default):  docker compose up --build   → http://localhost:8000
# With Traefik + TLS:        docker compose --profile traefik up --build
services:
  traefik:
    profiles: ["traefik"]
    image: traefik:v2.11
    environment:
      - DOCKER_API_VERSION=1.54
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=app_network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Default must not contain `@` — Compose treats `@` as starting a nested ref and breaks `${VAR:-default}`.
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-acme-placeholder.invalid}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist issued certificates across container recreates.
      - letsencrypt_data:/letsencrypt
    networks:
      - app_network

  app:
    build: .
    command: node src/index.js
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      # HSTS on HTTPS responses (browsers remember to use HTTPS for this host).
      - "traefik.http.middlewares.tuk-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.tuk-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.tuk-hsts.headers.stsPreload=false"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.rule=Host(`${APP_DOMAIN:-api.udithsandaruwan.com}`)"
      - "traefik.http.routers.app.middlewares=tuk-hsts@docker"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    networks:
      - app_network

volumes:
  letsencrypt_data:

networks:
  app_network:
    driver: bridge
