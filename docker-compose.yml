# Variable substitution in `labels` / `command` uses the project `.env` file (or your shell),
# not `env_file` on services. For Traefik + HTTPS, set APP_DOMAIN and LETSENCRYPT_EMAIL in `.env`.
#
# Local API only (default):  docker compose up --build   → http://localhost:8000
# With Traefik + TLS:        docker compose --profile traefik up --build
services:
  traefik:
    profiles: ["traefik"]
    image: traefik:v2.11
    environment:
      - DOCKER_API_VERSION=1.54
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=app_network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Default must not contain `@` — Compose treats `@` as starting a nested ref and breaks `${VAR:-default}`.
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-acme-placeholder.invalid}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - app_network

  app:
    build: .
    command: node src/index.js
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.rule=Host(`${APP_DOMAIN:-api.localhost}`)"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    networks:
      - app_network

volumes:
  letsencrypt_data:

networks:
  app_network:
    driver: bridge
